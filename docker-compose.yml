services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: veryjudge
      POSTGRES_PASSWORD: veryjudge
      POSTGRES_DB: veryjudge
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veryjudge -d veryjudge"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres_data:

