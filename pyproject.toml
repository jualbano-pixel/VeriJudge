[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veryjudge"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<0.116", "uvicorn>=0.34,<0.35", "sqlalchemy>=2.0,<2.1",
  "alembic>=1.14,<1.15", "psycopg[binary]>=3.2,<3.3", "pydantic>=2.10,<2.11",
  "httpx>=0.28,<0.29", "trafilatura>=2.0,<2.1", "pdfplumber>=0.11,<0.12",
  "jinja2>=3.1,<3.2", "pyyaml>=6,<7", "jsonschema>=4.23,<4.24", "lxml_html_clean>=0.4,<0.5"
]

[project.optional-dependencies]
test = ["pytest>=8.3,<8.4"]

[tool.setuptools.packages.find]
include = ["veryjudge*"]

[tool.setuptools.package-data]
veryjudge = ["*.txt", "templates/*.html", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: contacts real LLM/search providers; excluded from CI", "postgres: requires a disposable Postgres 15 database"]
